spring.application.name=gitpilot
spring.config.import=optional:application-secrets.properties
# Bind to the platform-provided port in production (e.g. Render sets $PORT); defaults to 8080 locally.
server.port=${PORT:8080}
# OAuth Configuration
spring.security.oauth2.client.registration.github.client-id=${github.client-id}
spring.security.oauth2.client.registration.github.client-secret=${github.client-secret}

# Database Configuration
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=health,info

# AI Provider Configuration
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.groq.api-key=${GROQ_API_KEY:}
ai.openrouter.api-key=${OPENROUTER_API_KEY:}

# GitHub Webhook Secret
github.webhook-secret=${github.webhook-secret:}

# Webhook Base URL (Cloudflare tunnel or public URL)
app.webhook-base-url=${APP_WEBHOOK_BASE_URL:}

# Explicit Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Session cookie behavior.
# Local development: defaults keep SameSite=Lax and non-Secure so cookies work over http://localhost.
# Production (Vercel frontend + Render backend, different domains over HTTPS): set
#   SESSION_COOKIE_SAMESITE=None and SESSION_COOKIE_SECURE=true so the session cookie
#   is sent on cross-site requests.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Allowed browser origins for cross-origin requests (empty locally; set to the Vercel URL in production).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
